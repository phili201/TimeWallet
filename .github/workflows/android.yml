name: TimeWallet Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "rewrite-timewallet" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeWallet-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
