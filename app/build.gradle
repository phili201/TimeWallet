plugins {
    id("com.android.application") version "8.4.2"
    id("org.jetbrains.kotlin.android") version "1.9.22"
}

android {
    namespace "com.example.timewallet"
    compileSdk 34
    defaultConfig {
        applicationId "com.example.timewallet"
        minSdk 26
        targetSdk 34
        versionCode 200
        versionName "2.0.0"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:image-labeling:17.0.9"
}
