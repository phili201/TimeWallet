name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        sudo mkdir -p $ANDROID_HOME/cmdline-tools
        sudo mkdir -p $ANDROID_HOME/licenses

        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | sudo tee $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f2e8c5c7d2f8c3b1a0b1a0b1a0b1a0b1a0b1a" | sudo tee $ANDROID_HOME/licenses/android-sdk-preview-license

        wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
        sudo unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Install Android Gradle Plugin
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "extras;google;m2repository"
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "extras;android;m2repository"

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TimeWallet-debug
        path: app/build/outputs/apk/debug/app-debug.apk
