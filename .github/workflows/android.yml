name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Run unit tests
      run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

    - name: Run Android lint
      run: ./gradlew --no-daemon --stacktrace lintDebug

    - name: Build Debug APK
      run: ./gradlew --no-daemon --stacktrace assembleDebug

    - name: Verify Debug APK
      run: test -s app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release APK
      run: ./gradlew --no-daemon --stacktrace assembleRelease

    - name: Verify Release APK
      run: test -s app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: TimeWallet-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: TimeWallet-release-unsigned
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: error
