name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TimeWallet

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | sudo tee /usr/local/lib/android/sdk/licenses/android-sdk-license
        echo "d56f2e8c5c7d2f8c3b1a0b1a0b1a0b1a0b1a0b1a" | sudo tee /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

        wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
        sudo unzip -q cmdline-tools.zip -d /usr/local/lib/android/sdk/cmdline-tools
        sudo mv /usr/local/lib/android/sdk/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest

        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TimeWallet-debug
        path: app/build/outputs/apk/debug/app-debug.apk